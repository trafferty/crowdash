; PlatformIO Project Configuration File
; CrowPanel Sensor Node - ESP12 with 3x DHT22

[platformio]
src_dir = src

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
    beegee-tokyo/DHT sensor library for ESPx@^1.19
build_flags =
    -I./include
    -I../common/include
    -I${sysenv.HOME}/.sierra
